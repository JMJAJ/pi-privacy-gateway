name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# a newer commit on the same branch cancels the run for the older one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -S warning gateway/bin/* scripts/*.sh scripts/pgw-clockfix image/build.sh tests/*.sh extras/host/pi-ip-failover
      - name: python
        run: python3 -m py_compile gateway/dashboard/dashboard.py
      - name: javascript
        run: node --check gateway/dashboard/web/app.js

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - name: load WireGuard on the host (the container is unprivileged, like in production)
        run: sudo modprobe wireguard
      - name: smoke test (unprivileged, isolated network namespace, offline WARP stand-in)
        run: sudo bash tests/smoke.sh

  arm64-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - name: build for Raspberry Pi (arm64)
        run: docker buildx build --platform linux/arm64 gateway

  adguard-seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - name: pre-configured AdGuard Home starts and accepts the login (no wizard)
        run: |
          bash scripts/adguard-seed.sh admin 'test-Pa55word' "$PWD/ag/conf"
          img=$(grep -oE 'adguard/adguardhome:[^ ]+' docker-compose.yml)
          docker run -d --name ag -p 3000:3000 -p 5353:53/udp -v "$PWD/ag/conf:/opt/adguardhome/conf" "$img"
          for i in $(seq 1 30); do curl -sf -u admin:test-Pa55word http://127.0.0.1:3000/control/status && break; sleep 2; done
          curl -sf -u admin:test-Pa55word http://127.0.0.1:3000/control/status | python3 -c "import sys,json;d=json.load(sys.stdin);assert d['running'] and d['dns_port']==53, d;print('AdGuard OK, version', d['version'])"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -u admin:wrong http://127.0.0.1:3000/control/status)" = 401 ]
          docker logs ag 2>&1 | tail -5

  # The SD card image's first boot, on a fresh Ubuntu 24.04 machine: the exact runcmd from image/user-data
  # (with this commit instead of a git clone), then checks that a user would get a working gateway.
  # Differences from a Pi: x86 instead of arm64, and the runner's preinstalled Docker CE instead of docker.io.
  firstboot:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - name: first boot (the pgw-firstboot installer from image/rootfs)
        run: |
          sudo apt-get install -y -q python3-yaml >/dev/null
          # the exact script the card writes, with this commit instead of a clone from GitHub
          cp image/rootfs/usr/local/sbin/pgw-firstboot /tmp/pgw-firstboot
          sed -i "s#git clone --depth 1 https://github.com/JMJAJ/pi-privacy-gateway.git \"\$DIR\"#cp -a $GITHUB_WORKSPACE \"\$DIR\"#" /tmp/pgw-firstboot
          grep -q "cp -a $GITHUB_WORKSPACE" /tmp/pgw-firstboot || { echo "could not adapt the script"; exit 1; }
          # the runner ships Docker CE; the card installs Ubuntu's docker.io - skip that one package swap
          sed -i 's/apt-get install -y -q docker.io docker-compose-v2 git curl qrencode/apt-get install -y -q git curl qrencode/' /tmp/pgw-firstboot
          sudo bash /tmp/pgw-firstboot || true
          sudo tail -40 /var/log/pgw-firstboot.log
          sudo grep -q PGW_FIRSTBOOT_DONE /var/log/pgw-firstboot.log
          test -f /var/lib/pgw-installed
      - name: what a new user gets
        run: |
          cd /opt/pi-privacy-gateway
          for i in $(seq 1 60); do [ "$(sudo docker inspect -f '{{.State.Health.Status}}' pgw-gateway 2>/dev/null)" = healthy ] && break; sleep 5; done
          sudo docker ps --format '{{.Names}} {{.Status}}'
          echo "--- gateway healthy";    [ "$(sudo docker inspect -f '{{.State.Health.Status}}' pgw-gateway)" = healthy ]
          echo "--- WARP connected";     timeout 60 sudo docker exec pgw-gateway curl -s -m 10 --interface wg0 https://1.1.1.1/cdn-cgi/trace | grep -q 'warp=on'
          echo "--- kill switch armed";  timeout 60 sudo iptables -C FORWARD -j PIX_FWD
          echo "--- dashboard answers";  timeout 60 curl -sf -m 10 http://127.0.0.1/api/mode | grep -q '"kill_switch": true'
          echo "--- add a device (QR)";  timeout 60 sudo docker exec pgw-gateway pgw add-peer phone >/dev/null && sudo test -s data/gateway/peers/phone.conf
          set -a; . <(sudo cat .env); set +a
          echo "--- AdGuard pre-configured, login from .env works"
          timeout 60 curl -sf -m 10 -u "$ADGUARD_USER:$ADGUARD_PASSWORD" http://127.0.0.1:3000/control/status | grep -q '"running":true'
          echo "--- DNS answers through AdGuard"; timeout 60 dig +short +time=5 @127.0.0.1 example.com | grep -qE '^[0-9.]+$'
          echo "--- clock fallback installed"; timeout 60 systemctl is-enabled pgw-clockfix.service
          echo ALL FIRST-BOOT CHECKS PASSED
