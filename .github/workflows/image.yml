name: SD card image

# Ready-to-flash Raspberry Pi image: official Ubuntu Server 24.04 LTS + this project's first-boot setup.
# Built for every release (attached to it) and on demand (downloadable from the run's artifacts).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:        # from release-please.yml, which creates the tag
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write   # upload the image to the release

jobs:
  image:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE: ${{ (inputs.tag || '') != '' || startsWith(github.ref, 'refs/tags/v') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: tools
        run: sudo apt-get update -q && sudo apt-get install -y -q mtools xz-utils fdisk python3-yaml
      - name: check first-boot files
        run: |
          python3 - <<'CHECK'
          import yaml
          u = yaml.safe_load(open('image/user-data')); yaml.safe_load(open('image/network-config'))
          # without these the ubuntu account stays locked (cloud.cfg: lock_passwd) and nobody can log in
          assert u.get('ssh_pwauth') is True, 'ssh_pwauth must be true'
          users = {x['name']: x for x in u['chpasswd']['users']}
          assert 'ubuntu' in users and u['chpasswd'].get('expire') is True, 'ubuntu needs a password that must be changed'
          import os
          for f in ('image/rootfs/usr/local/sbin/pgw-firstboot', 'image/rootfs/etc/systemd/system/pgw-firstboot.service'):
              assert os.path.getsize(f) > 100, f
          print('first-boot files OK: SSH + login ubuntu/ubuntu (forced change), installer in rootfs')
          CHECK
      - name: build
        run: bash image/build.sh "${TAG//\//-}"
      - name: check the Imager list file
        run: python3 -c "import json;o=json.load(open('image/os_list.json'))['os_list'][0];assert o['extract_size']>10**9 and len(o['image_download_sha256'])==64;assert o['init_format']=='cloudinit';print(o['name'], o['url'])"
      - name: attach to release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          gh release upload "$TAG" image/pi-privacy-gateway-*.img.xz image/pi-privacy-gateway-*.img.xz.sha256             image/os_list.json image/install-windows.cmd image/install-mac.command image/install-linux.sh --clobber
      - uses: actions/upload-artifact@v4
        if: env.RELEASE != 'true'
        with:
          name: sd-card-image
          path: |
            image/pi-privacy-gateway-*.img.xz*
            image/os_list.json
          retention-days: 7
